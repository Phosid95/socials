<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>fav_simracing | Links</title>
    <!-- FontAwesome für Social Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <!-- Stylische Retro-Schriftarten von Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;800&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
    <style>
        /* --- SYNTHWAVE ANIMIERTER HINTERGRUND --- */
        body {
            margin: 0;
            padding: 0;
            font-family: 'Rajdhani', sans-serif;
            background: linear-gradient(to bottom, #050515 0%, #1a0b2e 40%, #4a0d4e 70%, #c41c7b 100%);
            background-size: 100% 200%;
            animation: skyShift 10s ease infinite alternate;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        /* Himmel-Animation */
        @keyframes skyShift {
            0% { background-position: 0% 0%; }
            100% { background-position: 0% 100%; }
        }

        /* Neon-Sonne im Hintergrund */
        .retro-sun {
            position: fixed;
            top: 25%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 300px;
            height: 300px;
            background: linear-gradient(to bottom, #ffdd00, #f80759);
            border-radius: 50%;
            box-shadow: 0 0 60px rgba(248, 7, 89, 0.7);
            z-index: 0;
            mask-image: linear-gradient(to bottom, 
                white 0%, white 60%, 
                transparent 60%, transparent 65%, 
                white 65%, white 73%, 
                transparent 73%, transparent 79%, 
                white 79%, white 86%, 
                transparent 86%, transparent 91%, 
                white 91%, white 96%, 
                transparent 96%, transparent 100%);
            -webkit-mask-image: linear-gradient(to bottom, 
                white 0%, white 60%, 
                transparent 60%, transparent 65%, 
                white 65%, white 73%, 
                transparent 73%, transparent 79%, 
                white 79%, white 86%, 
                transparent 86%, transparent 91%, 
                white 91%, white 96%, 
                transparent 96%, transparent 100%);
            animation: sunPulse 4s ease-in-out infinite alternate;
        }

        @keyframes sunPulse {
            0% { transform: translate(-50%, -50%) scale(1); box-shadow: 0 0 40px rgba(248, 7, 89, 0.5); }
            100% { transform: translate(-50%, -50%) scale(1.05); box-shadow: 0 0 80px rgba(248, 7, 89, 0.9); }
        }

        /* Animiertes 3D-Bodenraster */
        .grid-floor {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 45vh;
            background-image: 
                linear-gradient(rgba(0, 242, 254, 0.15) 2px, transparent 2px),
                linear-gradient(90deg, rgba(0, 242, 254, 0.15) 2px, transparent 2px);
            background-size: 40px 40px;
            background-position: center top;
            transform: perspective(200px) rotateX(65deg);
            transform-origin: top center;
            animation: gridMove 2s linear infinite;
            z-index: 0;
            border-top: 2px solid #00f2fe;
            box-shadow: 0 -20px 50px rgba(0, 242, 254, 0.3);
        }

        @keyframes gridMove {
            0% { background-position: center 0px; }
            100% { background-position: center 40px; }
        }

        /* Horizont-Glühen */
        .horizon-glow {
            position: fixed;
            bottom: 45vh;
            left: 0;
            width: 100%;
            height: 100px;
            background: linear-gradient(to top, rgba(248, 7, 89, 0.4), transparent);
            z-index: 0;
            pointer-events: none;
        }

        /* --- CONTENT CARD STYLE --- */
        .profile-container {
            width: 100%;
            max-width: 440px;
            padding: 40px 24px;
            text-align: center;
            box-sizing: border-box;
            position: relative;
            z-index: 10;
            background: rgba(11, 5, 26, 0.8);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 2px solid #ff007f;
            border-radius: 24px;
            box-shadow: 0 0 30px rgba(255, 0, 127, 0.3), inset 0 0 15px rgba(0, 242, 254, 0.2);
            margin: 20px;
        }

        /* Profilbild Rundmaskierung & Neon-Glow */
        .profile-img {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #00f2fe;
            margin-bottom: 16px;
            box-shadow: 0 0 20px rgba(0, 242, 254, 0.8);
        }

        /* Name im Outrun-Font */
        .profile-name {
            font-family: 'Orbitron', sans-serif;
            font-size: 24px;
            font-weight: 800;
            margin: 0 0 8px 0;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #ffffff;
            text-shadow: 0 0 10px #ff007f, 0 0 20px #ff007f;
        }

        /* Bio Text */
        .profile-bio {
            font-size: 15px;
            color: #00f2fe;
            margin: 0 0 32px 0;
            font-weight: 600;
            line-height: 1.5;
            text-shadow: 0 0 5px rgba(0, 242, 254, 0.5);
        }

        .links-wrapper {
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        /* Standard Buttons */
        .link-card {
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            padding: 16px;
            background: rgba(255, 255, 255, 0.03);
            border: 2px solid #00f2fe;
            border-radius: 12px;
            text-decoration: none;
            color: #ffffff;
            font-size: 16px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            box-shadow: 0 0 10px rgba(0, 242, 254, 0.2);
        }

        .link-card i {
            position: absolute;
            left: 20px;
            font-size: 20px;
        }

        /* Hover-Effekt für Standard Buttons */
        .link-card:hover {
            transform: scale(1.03);
            background: rgba(0, 242, 254, 0.1);
            border-color: #ff007f;
            box-shadow: 0 0 20px rgba(255, 0, 127, 0.6), inset 0 0 8px rgba(255, 0, 127, 0.4);
            text-shadow: 0 0 8px #ffffff;
        }

        /* Pulsierender Twitch-Highlight-Button */
        .link-card.highlight {
            background: linear-gradient(90deg, #ff007f, #7928ca, #ff007f);
            background-size: 200% auto;
            border: 2px solid #ffffff;
            box-shadow: 0 0 20px rgba(255, 0, 127, 0.6);
            animation: gradientShift 3s linear infinite, buttonPulse 2s infinite;
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            100% { background-position: 200% 50%; }
        }

        @keyframes buttonPulse {
            0% { box-shadow: 0 0 15px rgba(255, 0, 127, 0.6); }
            50% { box-shadow: 0 0 30px rgba(255, 0, 127, 0.9), 0 0 10px rgba(0, 242, 254, 0.5); }
            100% { box-shadow: 0 0 15px rgba(255, 0, 127, 0.6); }
        }

        .link-card.highlight:hover {
            transform: scale(1.05);
            border-color: #00f2fe;
        }

        /* Fußzeile */
        .footer {
            margin-top: 40px;
            font-size: 13px;
            font-family: 'Orbitron', sans-serif;
            color: #ff007f;
            text-shadow: 0 0 5px rgba(255, 0, 127, 0.5);
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

    <!-- Synthwave Hintergrund-Elemente -->
    <div class="retro-sun"></div>

        <h1 class="profile-name">@fav_simracing</h1>
        <p class="profile-bio">Willkommen auf meiner Page! Hier findest du alle meine aktuellen Projekte, Streams und Socials auf einen Blick. ✨</p>

        <!-- Button-Liste -->
        <div class="links-wrapper">

            <!-- Twitch Live Highlight -->
            <a href="https://www.twitch.tv/fav_simracing" target="_blank" class="link-card highlight">

            <!-- Instagram -->
            <a href="https://www.instagram.com/fav_simracing/" target="_blank" class="link-card">

        </div>

        <div class="footer">
            &copy; 2026 @Phosid. Gehostet auf GitHub Pages.
        </div>

    </div>

</body>
</html>
