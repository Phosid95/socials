<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mein Creator Profil | Social Links</title>
    <!-- Einbinden von FontAwesome für die Social-Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <style>
        /* Grunddesign im modernen Dark-Mode */
        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #0b0c10;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* Container, der die Breite auf Mobilgeräten optimiert */
        .profile-container {
            width: 100%;
            max-width: 480px;
            padding: 40px 20px;
            text-align: center;
            box-sizing: border-box;
        }

        /* Profilbild (wird perfekt rund maskiert) */
        .profile-img {
            width: 96px;
            height: 96px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #1f2833;
            margin-bottom: 16px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
        }

        /* Name / Handle */
        .profile-name {
            font-size: 20px;
            font-weight: 700;
            margin: 0 0 8px 0;
            letter-spacing: -0.5px;
        }

        /* Kurze Beschreibung / Bio */
        .profile-bio {
            font-size: 14px;
            color: #8b949e;
            margin: 0 0 32px 0;
            line-height: 1.5;
        }

        /* Bereich für die Buttons */
        .links-wrapper {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        /* Styling der einzelnen Link-Buttons */
        .link-card {
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            padding: 16px;
            background-color: #161b22;
            border: 1px solid #30363d;
            border-radius: 12px;
            text-decoration: none;
            color: #ffffff;
            font-size: 15px;
            font-weight: 600;
            transition: transform 0.2s ease, background-color 0.2s ease, border-color 0.2s ease;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        /* Icon-Positionierung links im Button */
        .link-card i {
            position: absolute;
            left: 20px;
            font-size: 20px;
        }

        /* Hover-Effekte (beim Drüberfahren oder Tippen) */
        .link-card:hover {
            transform: translateY(-2px);
            background-color: #21262d;
            border-color: #8b949e;
        }

        /* Spezieller Highlight-Button (z.B. für deinen Live-Stream) */
        .link-card.highlight {
            background: linear-gradient(45deg, #8a3ab9, #e95950, #fccc63);
            border: none;
            color: #ffffff;
        }
        
        .link-card.highlight:hover {
            background: linear-gradient(45deg, #a154d1, #f06e66, #fdd57e);
            box-shadow: 0 6px 20px rgba(233, 89, 80, 0.4);
        }

        /* Fußzeile */
        .footer {
            margin-top: 48px;
            font-size: 12px;
            color: #484f58;
        }
    </style>
</head>
<body>

    <div class="profile-container">
        
        <!-- Profilbereich: Ersetze die Bild-URL mit deinem Profilbild -->
        <img src="https://scontent-fra5-1.cdninstagram.com/v/t51.82787-19/850496305_18131711989657131_2729926911285684384_n.jpg?stp=dst-jpg_s206x206_tt6&_nc_cat=109&ccb=7-5&_nc_sid=bf7eb4&efg=eyJ2ZW5jb2RlX3RhZyI6InByb2ZpbGVfcGljLnd3dy4xMDgwLkMzIn0%3D&_nc_ohc=3t1OdpbzJ9YQ7kNvwHcSBYB&_nc_oc=AdrTrDdJ4BvZbVLBsWefsoWm9CmdBklyEOy2QKNu7ONTCJzvnfVg0dPmUJS34c_Cp-Sh0poNwXD_1DkWqrPgDZid&_nc_zt=24&_nc_ht=scontent-fra5-1.cdninstagram.com&_nc_gid=Z4MAJO_NBG_9AtMXRd9khg&_nc_ss=7a6a8&oh=00_AQPv1Y2ZmXnv6xmLx2WexnftLvLBDPmSSnq4B8h92_-u-g&oe=6AE037CE" alt="Profilbild" class="profile-img">
        <h1 class="profile-name">@fav_simracing</h1>
        <p class="profile-bio">Willkommen auf meiner Page! Hier findest du alle meine aktuellen Projekte, Streams und Socials auf einen Blick. ✨</p>

        <!-- Button-Liste -->
        <div class="links-wrapper">

            <!-- Ein Highlight-Button (z.B. für Twitch / YouTube Live) -->
            <a href="https://www.twitch.tv/fav_simracing" target="_blank" class="link-card highlight">
                <i class="fa-brands fa-twitch"></i>
                Mein Live-Stream
            </a>

            <!-- Normale Social-Buttons -->
            <a href="https://www.instagram.com/fav_simracing/" target="_blank" class="link-card">
                <i class="fa-brands fa-instagram"></i>
                Instagram
            </a>

            <a href="https://www.youtube.com/@Porniracing" target="_blank" class="link-card">
                <i class="fa-brands fa-youtube"></i>
                YouTube
            </a>

        </div>

        <div class="footer">
            &copy; 2026 @Phosid. Gehostet auf GitHub Pages.
        </div>

    </div>

</body>
</html>
